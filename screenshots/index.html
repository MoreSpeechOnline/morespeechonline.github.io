<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoreSpeech — screenshots</title>
<style>
  :root { --ink:#14110f; --muted:#6b6259; --paper:#fbf8f3; --rule:#ddd4c6; --ox:#7a1f1f;
          --serif: "Iowan Old Style", Palatino, Georgia, serif; --sans: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); }
  header { padding:40px 28px 18px; border-bottom:1px solid var(--rule); }
  h1 { margin:0; font-size:32px; letter-spacing:-.02em; }
  p.sub { margin:8px 0 0; color:var(--muted); font-family:var(--sans); font-size:14px; }
  main { max-width:1100px; margin:0 auto; padding:28px; display:grid; gap:28px; }
  figure { margin:0; }
  img { width:100%; border:1px solid var(--rule); display:block; background:#fff; }
  figcaption { font-family:var(--sans); font-size:13px; color:var(--muted); margin-top:8px; }
  figcaption b { color:var(--ink); font-weight:600; }
  .narrow img { max-width:390px; margin:0 auto; }
</style>
</head>
<body>
<header>
  <h1>MoreSpeech — screenshots</h1>
  <p class="sub">morespeech.online · captured at 1440×900 unless noted · generated from the built single-page app</p>
</header>
<main id="gallery"></main>
<script>
const shots = [
  ["01-hero", "Hero", "The claim as a filed caption, the blocked thread as Exhibit A, the docket slip, and the tax stamp fixed in the corner."],
  ["02-argument", "The argument", "File 01: the five-part chain from Heffernan to Knight, each with its authority."],
  ["03-record", "The record", "The docket table: 22 coded suits, five merits wins, no damages awards."],
  ["04-defenses", "The defenses", "The Speech or Debate answer to the defenses, opened in the file."],
  ["05-letter", "The letter", "The open letter to the Attorney General, set as file correspondence."],
  ["05b-about", "About", "The ministry, the profile card, the gift insert, and both addresses the site answers on."],
  ["05c-ethics", "Code of Ethics", "The SQLite code as a governing document, the Rule in two columns."],
  ["06-builder-step1", "Builder · step 1", "You, with the live caption preview on the sheet."],
  ["07-step1-filled", "Builder · step 1 filled", "The caption updates on the sheet as you type."],
  ["08-step2-official", "Builder · step 2", "The official and the federal district."],
  ["09-step3-account", "Builder · step 3", "The indicia that make an account official, entered as evidence."],
  ["10-step4-events", "Builder · step 4", "The words you were blocked for, quoted exactly."],
  ["11-step5-evidence", "Builder · step 5", "A capture uploaded and lettered Exhibit A."],
  ["12-step6-options", "Builder · step 6", "Which documents to generate, tabbed by form."],
  ["13-generated-complaint", "Generated", "The complaint, in court formatting, ready to print."],
  ["14-exhibit-page", "Exhibit", "The exhibit page with the embedded capture."],
  ["15-share-prompt", "Share", "The post the app drafts for you."],
  ["16-mobile-hero", "Mobile", "390px wide, with the stamp shrunk to the corner."],
];
const main = document.getElementById("gallery");
for (const [file, title, note] of shots) {
  const fig = document.createElement("figure");
  if (file === "16-mobile-hero") fig.className = "narrow";
  fig.innerHTML = `<img src="${file}.png" alt="${title}" loading="lazy">
    <figcaption><b>${title}.</b> ${note}</figcaption>`;
  main.appendChild(fig);
}
</script>
</body>
</html>
